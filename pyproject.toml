[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockbuddy-evolution"
version = "0.1.2"
description = "DockBuddy 蛋白进化/设计分析(MSA保守性/共进化/ΔΔG预筛/热稳定/候选排序)，解耦版本"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DockBuddy" }]
keywords = ["protein", "evolution", "msa", "dca", "ddg", "stability", "bioinformatics"]
dependencies = [
    "dockbuddy-dock>=0.1.0",
    "numpy",
]

[project.urls]
Repository = "https://pypi.cnb.cool/vcinex/bioinfo/-/packages/simple"

[tool.setuptools.packages.find]
include = ["dockbuddy_evolution*"]
